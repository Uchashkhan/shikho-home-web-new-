<main class="profile-main flex flex-col gap-[24px] px-[16px] pt-[24px] pb-[36px]">
      <!-- Signed in: who the student is -->
      <section class="border border-[#EDEDED] border-solid bg-white rounded-[12px] p-[16px] flex flex-col gap-[16px]" data-auth="in" hidden aria-label="প্রোফাইল তথ্য">
        <div class="flex items-center gap-[16px]">
          <div class="size-[64px] shrink-0 overflow-hidden rounded-full bg-[#F9D0E2] text-[#E2136E] flex items-center justify-center font-fold font-semibold text-[24px]" data-user="avatar" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9Zm0 2c-4.42 0-8 2.24-8 5v1.5c0 .55.45 1 1 1h14c.55 0 1-.45 1-1V19c0-2.76-3.58-5-8-5Z"/></svg>
          </div>
          <div class="min-w-0">
            <p class="m-0 truncate font-fold font-semibold text-[16px] leading-[24px] text-[#202020]" data-user="name"></p>
            <p class="m-0 truncate font-fold font-medium text-[14px] leading-[20px] text-[#505050]" data-user="class-line"></p>
          </div>
        </div>
        <a href="#" class="btn-secondary w-full" data-route="editProfile">প্রোফাইল এডিট করো</a>
        <dl class="profile-facts">
          <div class="profile-fact">
            <dt class="font-fold font-medium text-[14px] leading-[20px] text-[#505050] shrink-0">ক্লাস</dt>
            <dd class="m-0 min-w-0 truncate text-right font-fold font-semibold text-[14px] leading-[20px] text-[#202020]" data-user="class" data-fallback="দেওয়া হয়নি"></dd>
          </div>
          <div class="profile-fact">
            <dt class="font-fold font-medium text-[14px] leading-[20px] text-[#505050] shrink-0">গ্রুপ</dt>
            <dd class="m-0 min-w-0 truncate text-right font-fold font-semibold text-[14px] leading-[20px] text-[#202020]" data-user="group" data-fallback="দেওয়া হয়নি"></dd>
          </div>
          <div class="profile-fact">
            <dt class="font-fold font-medium text-[14px] leading-[20px] text-[#505050] shrink-0">শিক্ষাবর্ষ</dt>
            <dd class="m-0 min-w-0 truncate text-right font-fold font-semibold text-[14px] leading-[20px] text-[#202020]" data-user="exam" data-fallback="দেওয়া হয়নি"></dd>
          </div>
        </dl>
      </section>

      <!-- Signed out: account entry point -->
      <section class="border border-[#EDEDED] border-solid bg-white rounded-[12px] p-[16px] flex flex-col gap-[12px]" data-auth="out" hidden>
        <p class="m-0 font-fold font-medium text-[14px] leading-[20px] text-[#505050]">তোমার প্রোফাইল দেখতে লগইন করো</p>
        <a href="#" class="btn-primary w-full" data-route="login">লগইন করো</a>
      </section>

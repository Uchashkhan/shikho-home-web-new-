<!-- তোমার প্রোগ্রাম (paid): the program bought through bKash, its current quarter and the days left.
     One card in the bKash layout (Slate-bordered, flat); the program name follows the profile's switcher
     (sheet.js [data-program]), the days left come from the program's end date (main.js). -->
<div class="prog-box" data-name="Section">
      <p class="prog-label">তোমার প্রোগ্রাম</p>
      <h2 class="prog-name" data-program="current">ক্লাস ৯ - SSC ’২৮ বিজ্ঞান</h2>
      <article class="prog-card">
        <span class="prog-tag"><img alt="" width="17" height="16" src="assets/p02-icon3.svg">ভর্তি হয়েছো</span>
        <div class="prog-card-row">
          <div class="prog-icon h-[60px] overflow-clip relative shrink-0 w-[61px]" aria-hidden="true" data-name="Icon">
                    <div class="absolute inset-[0_0.15%_0_1.49%]" data-name="Vector">
                      <img alt="" class="absolute block inset-0 max-w-none size-full" src="assets/p02-vector.svg">
                    </div>
                    <div class="absolute contents inset-[23.33%_23.1%_23.33%_24.44%]" data-name="Clip path group">
                      <div class="absolute inset-[25.78%_23.1%_25.78%_24.44%] mask-alpha mask-intersect mask-no-clip mask-no-repeat mask-position-[0px_-1.469px] mask-size-[32px_32px]" style="mask-image: url(&quot;assets/p02-group.svg&quot;)" data-name="Group">
                        <img alt="" class="absolute block inset-0 max-w-none size-full" src="assets/p02-group1.svg">
                      </div>
                    </div>
                    <div class="absolute inset-[0.04%_49.33%_0.04%_1.49%]" data-name="Mask group">
                      <img alt="" class="absolute block inset-0 max-w-none size-full" src="assets/p02-mask-group.svg">
                    </div>
                  </div>
          <div class="prog-card-text">
            <h3>কোয়ার্টার ৩</h3>
            <p>সেপ্টেম্বর’ ২৬ - ডিসেম্বর’ ২৬</p>
          </div>
        </div>
        <a href="#" data-route="program" class="btn-primary btn-block prog-cta">শেখা চালিয়ে যাও<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></a>
      </article>
      <p class="prog-days"><img alt="" width="20" height="20" src="assets/p02-image3-d-clock.png"><span>তোমার প্রোগ্রাম-এর মেয়াদ আর মাত্র <b data-program-days>৬৩ দিন!</b></span></p>
    </div>
